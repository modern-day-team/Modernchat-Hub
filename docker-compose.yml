# 本地开发环境：MySQL 8（映射到 3308，避开主仓库 3306 与 SSO 3307）
services:
  mysql:
    image: mysql:8
    ports:
      - "3308:3306"
    environment:
      # 仅限本地开发默认值；生产一律用环境变量注入，严禁提交真实凭据
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-modernchat_hub_dev}
      MYSQL_DATABASE: modernchat_hub
    volumes:
      - hub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  hub-mysql-data:
